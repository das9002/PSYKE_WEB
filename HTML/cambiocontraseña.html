<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyke - Cambio de Contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../css/stylecambiocontraseña.css">
    <link rel="stylesheet" href="../css/styleTemaoscuro.css">
    <link rel="icon" href="../img/Logo0.png" crossorigin>
    <script>
        (function () {
            if (localStorage.getItem('psyke_dark_mode') === 'enabled') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>

<body>

    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="floating-sphere sphere-1"></div>
    <div class="floating-sphere sphere-2"></div>
    <div class="floating-sphere sphere-3"></div>
    <div class="floating-sphere sphere-4"></div>
    <div class="floating-sphere sphere-5"></div>
    <div class="floating-sphere sphere-6"></div>

    <div class="split-card">

        <div class="left-panel">
            <h1 class="form-header-title d-flex align-items-center gap-2">
                <i class="bi bi-shield-lock-fill text-primary"></i>
                <span>Cambio de contraseña</span>
            </h1>

            <form id="passwordForm">
                <div class="custom-input-group">
                    <label for="currentPassword">Contraseña actual</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock-fill field-icon"></i>
                        <input type="password" id="currentPassword" placeholder="Introduce tu contraseña actual" minlength="8" maxlength="100" required>
                        <button type="button" class="btn-eye-toggle" data-target="currentPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="custom-input-group">
                    <label for="newPassword">Nueva contraseña</label>
                    <div class="input-wrapper">
                        <i class="bi bi-key-fill field-icon"></i>
                        <input type="password" id="newPassword" placeholder="Introduce tu nueva contraseña" minlength="8" maxlength="100" required>
                        <button type="button" class="btn-eye-toggle" data-target="newPassword">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <ul class="validation-box">
                    <li class="validation-item invalid" id="reqLength">
                        <i class="bi bi-x-circle-fill"></i> Mínimo 8 caracteres
                    </li>
                    <li class="validation-item invalid" id="reqUpper">
                        <i class="bi bi-x-circle-fill"></i> Al menos una mayúscula
                    </li>
                    <li class="validation-item invalid" id="reqNumber">
                        <i class="bi bi-x-circle-fill"></i> Al menos un número
                    </li>
                    <li class="validation-item invalid" id="reqSpecial">
                        <i class="bi bi-x-circle-fill"></i> Un carácter especial (!@#$)
                    </li>
                </ul>

                <div class="custom-input-group mb-4">
                    <label for="confirmPassword">Confirmar contraseña nueva</label>
                    <div class="input-wrapper">
                        <i class="bi bi-shield-check field-icon"></i>
                        <input type="password" id="confirmPassword" placeholder="Repite tu nueva contraseña" minlength="8" maxlength="100" required>
                        <button type="button" class="btn-eye-toggle" data-target="confirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="text-center text-lg-start mt-2">
                    <button type="submit" class="btn-submit-blue d-inline-flex align-items-center gap-2">
                        <i class="bi bi-check2-circle"></i>
                        <span>Actualizar contraseña</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="right-panel">
            <h2>¡Hola!</h2>
            <p>Mantén tus datos, casos y progresos protegidos actualizando tu contraseña regularmente en Psyke.</p>
            <a href="config.html" class="btn-outline-white" id="btnVolver">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="../JS/services/config.js"></script>
    <script src="../JS/services/profileService.js"></script>
    <script src="../JS/services/notificacionesService.js"></script>
    <script src="../JS/controllers/passwordController.js"></script>
</body>

</html>
