<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyke - Mi Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../css/styleperfil.css">
    <link rel="stylesheet" href="../css/styleTemaoscuro.css">
    <link rel="stylesheet" href="../css/styleAlertas.css">
    <link rel="icon" href="../img/Logo0.png" crossorigin>
    <script>
        (function () {
            if (/(?:^|;\s*)psyke_dark_mode=enabled(?:;|$)/.test(document.cookie)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>

<body>

    <div class="page-wrapper">

        <a href="config.html" class="btn-volver">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>

        <div class="avatar-container">
            <div class="avatar-circle" id="avatarCircle">--</div>
        </div>

        <div class="perfil-encabezado">
            <h1 class="perfil-nombre" id="perfilNombre">Cargando...</h1>
            <span class="perfil-rol" id="perfilRol"></span>
        </div>

        <div class="form-center-box">
            <div class="section-label text-uppercase">Información Personal</div>

            <div class="alert alert-info d-none small" id="avisoSinPerfil" role="status">
                Tu cuenta no tiene un perfil de psicólogo asociado, por eso no hay nombres registrados.
            </div>

            <div class="custom-form-group">
                <div class="custom-form-field">
                    <span class="perfil-etiqueta">Nombres</span>
                    <span class="perfil-valor" id="verNombres">—</span>
                </div>
                <div class="custom-form-field">
                    <span class="perfil-etiqueta">Apellidos</span>
                    <span class="perfil-valor" id="verApellidos">—</span>
                </div>
            </div>

            <div class="section-label text-uppercase">Datos de la Cuenta</div>
            <div class="custom-form-group">
                <div class="custom-form-field">
                    <span class="perfil-etiqueta">Correo Institucional</span>
                    <span class="perfil-valor email-underlined" id="verCorreo">—</span>
                </div>
                <div class="custom-form-field">
                    <span class="perfil-etiqueta">Rol</span>
                    <span class="perfil-valor" id="verRol">—</span>
                </div>
                <div class="custom-form-field">
                    <span class="perfil-etiqueta">Estado de la cuenta</span>
                    <span class="perfil-valor" id="verEstadoCuenta">—</span>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="cambiocontrasena.html" class="btn-guardar d-inline-flex align-items-center gap-2 text-decoration-none">
                    <i class="bi bi-shield-lock"></i> Cambiar contraseña
                </a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    
    <script src="../JS/services/env.js"></script>
    <script src="../JS/services/config.js"></script>
    <script src="../JS/services/notificacionesService.js"></script>
    <script src="../JS/services/authService.js"></script>
    <script src="../JS/services/profileService.js"></script>
    <script src="../JS/controllers/profileController.js"></script>
</body>

</html>
