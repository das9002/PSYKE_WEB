<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyke - Editar Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../css/styleperfil.css">
    <link rel="stylesheet" href="../css/styleTemaoscuro.css">
    <link rel="icon" href="../img/Logo0.png" crossorigin>
    <script>
        (function () {
            if (localStorage.getItem('psyke_dark_mode') === 'enabled') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>

<body>

    <div class="page-wrapper">

        <a href="config.html" class="btn-volver" id="btnVolver">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>

        <div class="avatar-container">
            <div class="avatar-circle">--</div>
        </div>

        <div class="form-center-box">
            <form id="editProfileForm">

                <div class="section-label text-uppercase">Información Personal del Psicólogo</div>

                <div class="custom-form-group">
                    <div class="custom-form-field">
                        <label for="inputNombre">Nombres</label>
                        <input type="text" id="inputNombre" placeholder="Tus nombres" maxlength="100" required>
                    </div>
                    <div class="custom-form-field">
                        <label for="inputApellido">Apellidos</label>
                        <input type="text" id="inputApellido" placeholder="Tus apellidos" maxlength="100" required>
                    </div>
                    <div class="custom-form-field">
                        <label for="inputEspecialidad">Especialidad</label>
                        <input type="text" id="inputEspecialidad" placeholder="Especialidad clínica / psicológica" maxlength="100" required>
                    </div>
                </div>

                <div class="section-label text-uppercase">Datos de Contacto</div>
                <div class="custom-form-group">
                    <div class="custom-form-field">
                        <label for="inputEmail">Correo Institucional</label>
                        <input type="email" id="inputEmail" placeholder="correo@ricaldone.edu.sv" class="email-underlined" maxlength="100" readonly>
                        <a href="#" class="action-link-blue" id="actionCambiarEmail">Cambiar</a>
                    </div>
                    <div class="custom-form-field">
                        <label for="inputTelefono">Teléfono</label>
                        <input type="tel" id="inputTelefono" placeholder="+503 0000-0000" maxlength="16" readonly>
                        <a href="#" class="action-link-green" id="actionAgregarTelefono">Editar</a>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn-guardar">
                        <i class="bi bi-floppy me-1"></i> Guardar Cambios
                    </button>
                </div>

            </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="../JS/services/config.js"></script>
    <script src="../JS/services/profileService.js"></script>
    <script src="../JS/services/notificacionesService.js"></script>
    <script src="../JS/controllers/profileController.js"></script>
</body>

</html>
